<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vpiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#071524" />
    </linearGradient>
    <linearGradient id="vpiGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8bc34a" />
      <stop offset="100%" stop-color="#689f38" />
    </linearGradient>
  </defs>
  <!-- Base Shield/Circle -->
  <rect width="100" height="100" rx="24" fill="url(#vpiBg)" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#8bc34a" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Car Silhouette Curve -->
  <path d="M 18 58 Q 30 26 50 26 Q 70 26 82 58" fill="none" stroke="url(#vpiGreen)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Wheels -->
  <circle cx="34" cy="58" r="7" fill="#ffffff" />
  <circle cx="34" cy="58" r="3.5" fill="#0f2b48" />
  
  <circle cx="66" cy="58" r="7" fill="#ffffff" />
  <circle cx="66" cy="58" r="3.5" fill="#0f2b48" />

  <!-- VPI Text -->
  <text x="50" y="80" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#8bc34a" text-anchor="middle" letter-spacing="1.5">VPI</text>
</svg>
